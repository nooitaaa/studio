<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title> Noa Merlini </title>
    <link rel="stylesheet" href="style.css">
  </head>

  <body class="homepage">

    <div class="footer1">
        <div class="header-right">
            <div id="div_horloge"></div>
        </div>
    </div>

    <div class="slideshow-container fullscreen">

        <div class="slide"><img src="images/0_random.jpg" alt="0_random"></div>
        <div class="slide"><img src="images/2_camouflage.jpg" alt="2_camouflage"></div>
        <div class="slide"><img src="images/3_tesi_ma.jpg" alt="3_tesi_ma"></div>

        <div class="slide">
            <video class="video-toggle" loop muted playsinline>
                <source src="images/4_radiospugna.mp4" type="video/mp4">
                Il tuo browser non supporta i video.
            </video>
        </div>

        <div class="slide"><img src="images/5_radiospugna.jpg" alt="5_radiospugna"></div>
        <div class="slide"><img src="images/6_radiospugna.jpeg" alt="6_radiospugna"></div>

        <a href="about.html" class="slideshow-caption">
            Noa Merlini<br>
            Concept research and Creative development
        </a>

    </div>

    <script>
        // --- Orologio in header ---
        function tickClock() {
            const el = document.getElementById('div_horloge');
            if (!el) return;
            const now = new Date();
            const pad = n => String(n).padStart(2, '0');
            el.textContent = `${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
        }
        tickClock();
        setInterval(tickClock, 1000);

        // --- SLIDESHOW: un'immagine/video alla volta, dissolvenza, vuoto tra le slide ---
        const HOLD_MS = 3000;   // durata di ogni slide visibile
        const FADE_MS = 800;    // durata della dissolvenza (combacia col CSS transition)
        const GAP_MS = 1000;    // durata del "vuoto" bianco tra una slide e l'altra

        const slides = Array.from(document.querySelectorAll('.slideshow-container .slide'));
        let current = 0;

        function getMedia(slide) {
            return slide.querySelector('img, video');
        }
        function playIfVideo(slide) {
            const media = getMedia(slide);
            if (media && media.tagName === 'VIDEO') {
                media.currentTime = 0;
                media.play().catch(() => {});
            }
        }
        function pauseIfVideo(slide) {
            const media = getMedia(slide);
            if (media && media.tagName === 'VIDEO') media.pause();
        }

        function runSlideshow() {
            if (slides.length === 0) return;
            const slide = slides[current];
            slide.classList.add('active');
            playIfVideo(slide);

            setTimeout(() => {
                slide.classList.remove('active');
                pauseIfVideo(slide);

                setTimeout(() => {
                    current = (current + 1) % slides.length;
                    runSlideshow();
                }, FADE_MS + GAP_MS);
            }, HOLD_MS);
        }
        if (slides.length > 0) runSlideshow();

        // Click su video attivo: play/pausa + mute toggle (desktop)
        const isMobile = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);
        document.querySelectorAll('.video-toggle').forEach(video => {
            if (!isMobile) {
                video.addEventListener('click', function () {
                    if (video.paused) {
                        video.play();
                        video.muted = true;
                    } else {
                        video.muted = !video.muted;
                    }
                });
            }
        });
    </script>

  </body>
</html>
