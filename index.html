<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title> Noa Merlini </title>
    <link rel="stylesheet" href="style.css">
    
    <style>
      /* --- Regole applicate SOLO su schermi piccoli (Mobile). Desktop non viene toccato --- */
      @media (max-width: 840px) {
          .slide {
              position: relative;
              width: 100%;
              height: 100%;
              display: flex;
              align-items: center;
              justify-content: center;
          }
          
          .slide-caption {
              position: absolute !important;
              bottom: 20px !important; /* Allineato in basso */
              left: 20px !important;   /* Allineato a sinistra */
              margin: 0 !important;
              color: black;
              font-family: "Times New Roman", Times, serif;
              font-size: 15px;
              line-height: 1.0;
              z-index: 5;
              pointer-events: none;
          }
      }
    </style>
  </head>

  <body class="homepage">

    <div class="slideshow-container fullscreen" id="slideshow"></div>

    <!-- Ho ripristinato il tuo codice esatto, senza inline styles, così legge il tuo style.css -->
    <a href="about.html" class="slideshow-caption">
        Noa Merlini<br>
        Graphic Design and Creative development<br>
        Via Bernardino Verro 41, Milan (Italy)
    </a>

    <script>
        // --- Elenco dei file ---
        const MEDIA_LIST = [
            { type: 'image', src: 'images/IMG_4402.png', title: 'Portrait with Plants' },
            { type: 'image', src: 'images/IMG_4409.png', title: 'Portrait in Nature' },
            { type: 'image', src: 'images/IMG_4410.png', title: 'Hand and Red Detail' },
            { type: 'image', src: 'images/IMG_4411_1.png', title: 'Collage Page' },
            { type: 'image', src: 'images/IMG_4416.png', title: 'Couple Portrait' },
            { type: 'image', src: 'images/IMG_4419.png', title: 'Abstract Detail' },
            { type: 'image', src: 'images/IMG_4423_1.png', title: 'Object on Surface' },
            { type: 'image', src: 'images/IMG_4428.png', title: 'Open Book (Spread 1)' },
            { type: 'image', src: 'images/IMG_4430.png', title: 'Open Book (Spread 2)' },
            { type: 'image', src: 'images/IMG_4432.png', title: 'Text Detail (Spread)' },
            { type: 'image', src: 'images/IMG_4444.png', title: 'Open Book (Binding)' },
            { type: 'image', src: 'images/IMG_4447.png', title: 'Open Catalog Pages' },
            { type: 'image', src: 'images/IMG_4452.png', title: 'Male Portrait (Suit)' },
            { type: 'image', src: 'images/IMG_4453.png', title: 'Close-Up Portrait' },
            { type: 'image', src: 'images/IMG_4454.png', title: 'Female Portrait (Smiling)' },
            { type: 'image', src: 'images/IMG_4456.png', title: 'Book Collage Page' },
            { type: 'image', src: 'images/IMG_4458.png', title: 'Fabric Texture' },
            { type: 'image', src: 'images/IMG_4471.png', title: 'Object Display' },
            { type: 'image', src: 'images/IMG_4473.png', title: 'Mixed Media Page' },
            { type: 'image', src: 'images/IMG_4474.png', title: 'Illustrated Page' },
            { type: 'image', src: 'images/IMG_4476.png', title: 'Paper Detail' },
            { type: 'image', src: 'images/IMG_4480.png', title: 'Urban Scene' },
        ];

        const DESKTOP_BREAKPOINT = 841;
        const isDesktop = window.innerWidth >= DESKTOP_BREAKPOINT;
        if (isDesktop) document.body.classList.add('desktop-mode');
        else document.body.classList.add('mobile-mode');

        function detectOrientation(item) {
            return new Promise(resolve => {
                if (item.type === 'image') {
                    const img = new Image();
                    img.onload = () => resolve(img.naturalWidth >= img.naturalHeight ? 'landscape' : 'portrait');
                    img.onerror = () => resolve('landscape');
                    img.src = item.src;
                } else {
                    const video = document.createElement('video');
                    video.muted = true;       
                    video.playsInline = true; 
                    video.preload = 'metadata';
                    video.onloadedmetadata = () => resolve(video.videoWidth >= video.videoHeight ? 'landscape' : 'portrait');
                    video.onerror = () => resolve('landscape');
                    video.src = item.src;
                }
            });
        }

        function createMediaElement(item) {
            let el;
            if (item.type === 'image') {
                el = document.createElement('img');
                el.src = item.src;
                el.alt = item.title || 'Portfolio image';
                el.loading = 'lazy'; 
            } else {
                el = document.createElement('video');
                el.loop = true;
                el.muted = true;
                el.playsInline = true;
                el.classList.add('video-toggle');
                const source = document.createElement('source');
                source.src = item.src;
                source.type = 'video/mp4';
                el.appendChild(source);
            }
            el.classList.add('slide-media');
            return el;
        }

        function createCaptionElement(item) {
            const cap = document.createElement('div');
            cap.className = 'slide-caption';
            cap.textContent = item.title || '';
            return cap;
        }

        function buildGroups(items) {
            if (!isDesktop) {
                return items.map(item => [item]); 
            }
            const groups = [];
            let i = 0;
            while (i < items.length) {
                const current = items[i];
                const next = items[i + 1];
                if (current.orientation === 'portrait' && next && next.orientation === 'portrait') {
                    groups.push([current, next]);
                    i += 2;
                } else {
                    groups.push([current]);
                    i += 1;
                }
            }
            return groups;
        }

        function renderSlides(groups) {
            const container = document.getElementById('slideshow');
            container.innerHTML = '';
            groups.forEach(group => {
                const slide = document.createElement('div');
                slide.className = 'slide';

                if (group.length === 2) {
                    const pair = document.createElement('div');
                    pair.className = 'slide-pair';
                    group.forEach(item => {
                        const half = document.createElement('div');
                        half.className = 'pair-half';
                        half.appendChild(createMediaElement(item));
                        half.appendChild(createCaptionElement(item));
                        pair.appendChild(half);
                    });
                    slide.appendChild(pair);
                } else {
                    slide.appendChild(createMediaElement(group[0]));
                    slide.appendChild(createCaptionElement(group[0])); // Aggiunge testo su Mobile
                }

                container.appendChild(slide);
            });
        }

        const HOLD_MS = 4000;   
        const FADE_MS = 1000;    
        const GAP_MS = 800;    

        let current = 0;
        let slides = [];

        function getMediaEls(slide) {
            return Array.from(slide.querySelectorAll('.slide-media'));
        }
        function playVideos(slide) {
            getMediaEls(slide).forEach(media => {
                if (media.tagName === 'VIDEO') {
                    media.currentTime = 0;
                    media.play().catch(() => {});
                }
            });
        }
        function pauseVideos(slide) {
            getMediaEls(slide).forEach(media => {
                if (media.tagName === 'VIDEO') media.pause();
            });
        }

        function runSlideshow() {
            if (slides.length === 0) return;
            const slide = slides[current];
            slide.classList.add('active');
            playVideos(slide);

            setTimeout(() => {
                slide.classList.remove('active');
                pauseVideos(slide);

                setTimeout(() => {
                    current = (current + 1) % slides.length;
                    runSlideshow();
                }, FADE_MS + GAP_MS);
            }, HOLD_MS);
        }

        // --- AVVIO INTELLIGENTE ---
        async function startSlideshow() {
            let itemsForSlides = [];

            if (isDesktop) {
                itemsForSlides = await Promise.all(MEDIA_LIST.map(async item => {
                    const orientation = await detectOrientation(item);
                    return { ...item, orientation };
                }));
            } else {
                itemsForSlides = MEDIA_LIST;
            }

            const groups = buildGroups(itemsForSlides);
            renderSlides(groups);
            slides = Array.from(document.querySelectorAll('.slideshow-container .slide'));
            runSlideshow();
        }

        // Fai partire tutto
        startSlideshow();

        // --- SOLUZIONE PULITA: CLICCARE IN QUALSIASI PUNTO PORTA ALLA PAGINA ABOUT ---
        document.addEventListener('click', function(event) {
            // Se clicchi esattamente sopra il tuo nome in basso (che è già un link ad about.html) 
            // lascia fare al link il suo lavoro naturale.
            if (event.target.closest('a')) return;
            
            // Per qualsiasi altro punto dello schermo: reindirizza alla pagina About
            window.location.href = 'about.html';
        });

    </script>

  </body>
</html>
