<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Noa Merlini</title>
    <link rel="stylesheet" href="style.css">

    <style>
      /* --- Regole applicate SOLO su schermi piccoli (Mobile o Desktop stretto). --- */
      @media (max-width: 840px) {
          .slide {
              position: relative;
              width: 100%;
              height: 100%;
              display: flex;
              align-items: center;
              justify-content: center;
          }

          .slide-caption {
              position: absolute !important;
              bottom: 20px !important;
              left: 20px !important;
              margin: 0 !important;
              color: black;
              font-family: "Times New Roman", Times, serif;
              font-size: 15px;
              line-height: 1.0;
              z-index: 5;
              pointer-events: none;
          }
      }
    </style>
  </head>

  <body class="homepage">

    <div class="slideshow-container fullscreen" id="slideshow"></div>

    <a href="about.html" class="slideshow-caption">
        Noa Merlini<br>
        Graphic Design and Creative development<br><br>
        Via Bernardino Verro 41, <br>Milan (Italy)
    </a>

    <script>
        // Aggiungi il campo "project" con lo STESSO valore alle immagini
        // verticali che vuoi vedere sempre abbinate tra loro (stesso progetto).
        // Le immagini senza "project" (o con project diverso dalle altre)
        // non verranno MAI abbinate ad altre: restano sempre singole.
        const MEDIA_LIST = [
            { type: 'image', src: 'images/IMG_4402.png', title: 'Portrait with Plants', project: 'y' },
            { type: 'image', src: 'images/IMG_4409.png', title: 'Portrait in Nature', project: 'y' },
            { type: 'image', src: 'images/IMG_4410.png', title: 'Hand and Red Detail', project: 'flash art' },
            { type: 'image', src: 'images/IMG_4411_1.png', title: 'Collage Page', project: 'flash art' },
            { type: 'image', src: 'images/IMG_4416.png', title: 'Couple Portrait', project: 'first sight' },
            { type: 'image', src: 'images/IMG_4419.png', title: 'Abstract Detail', project: 'first sight' },
            { type: 'image', src: 'images/IMG_4423_1.png', title: 'Object on Surface', project: 'first sight' },
            { type: 'image', src: 'images/IMG_4428.png', title: 'Open Book (Spread 1)', project: 'fronzoni' },
            { type: 'image', src: 'images/IMG_4430.png', title: 'Open Book (Spread 2)', project: 'fronzoni' },
            { type: 'image', src: 'images/IMG_4432.png', title: 'Text Detail (Spread)', project: 'dddd' },
            { type: 'image', src: 'images/IMG_4444.png', title: 'Open Book (Binding)', project: 'camouflage' },
            { type: 'image', src: 'images/IMG_4447.png', title: 'Open Catalog Pages', project: 'camouflage' },
            { type: 'image', src: 'images/IMG_4452.png', title: 'Male Portrait (Suit)', project: 'x' },
            { type: 'image', src: 'images/IMG_4453.png', title: 'Close-Up Portrait', project: 'x' },
            { type: 'image', src: 'images/IMG_4454.png', title: 'Female Portrait (Smiling)', project: 'x' },
            { type: 'image', src: 'images/IMG_4456.png', title: 'Book Collage Page', project: 'x' },
            { type: 'image', src: 'images/IMG_4458.png', title: 'Fabric Texture', project: 'x' },
            { type: 'image', src: 'images/IMG_4471.png', title: 'Object Display', project: 'x' },
            { type: 'image', src: 'images/IMG_4473.png', title: 'Mixed Media Page', project: 'x' },
            { type: 'image', src: 'images/IMG_4474.png', title: 'Illustrated Page', project: 'x' },
            { type: 'image', src: 'images/IMG_4476.png', title: 'Paper Detail', project: 'x' },
            { type: 'image', src: 'images/IMG_4480.png', title: 'Urban Scene', project: 'x' },
        ];

        const DESKTOP_BREAKPOINT = 841;

        let slideshowTimeoutId = null;
        let fadeTimeoutId = null;
        let isDesktopState = window.innerWidth >= DESKTOP_BREAKPOINT;

        // Elementi già caricati (con orientamento rilevato), popolati una sola volta.
        let preparedItems = [];
        // Ordine mescolato dei "blocchi" (singoli o coppie di stesso progetto),
        // calcolato una sola volta per sessione/pagina.
        let shuffledBlocks = null;

        function updateBodyClass() {
            if (isDesktopState) {
                document.body.classList.add('desktop-mode');
                document.body.classList.remove('mobile-mode');
            } else {
                document.body.classList.add('mobile-mode');
                document.body.classList.remove('desktop-mode');
            }
        }
        updateBodyClass();

        function buildMediaElement(item) {
            let el;
            if (item.type === 'image') {
                el = document.createElement('img');
                el.alt = item.title || 'Portfolio image';
            } else {
                el = document.createElement('video');
                el.loop = true;
                el.muted = true;
                el.playsInline = true;
                el.classList.add('video-toggle');
                const source = document.createElement('source');
                source.type = 'video/mp4';
                el.appendChild(source);
            }
            el.classList.add('slide-media');
            return el;
        }

        // Carica ogni file UNA SOLA VOLTA: lo stesso elemento creato qui
        // serve sia per rilevare l'orientamento sia per essere mostrato in pagina
        // (niente doppio download come nella versione precedente).
        function loadItem(item, index) {
            return new Promise(resolve => {
                const el = buildMediaElement(item);
                const finish = (orientation) => resolve({ ...item, el, orientation });

                if (item.type === 'image') {
                    el.onload = () => finish(el.naturalWidth >= el.naturalHeight ? 'landscape' : 'portrait');
                    el.onerror = () => finish('landscape');
                    if (index === 0) {
                        // Dai priorità al primo elemento visibile.
                        el.fetchPriority = 'high';
                    } else {
                        el.loading = 'eager'; // sono comunque tutte "in viewport", meglio essere espliciti
                    }
                    el.src = item.src;
                } else {
                    el.onloadedmetadata = () => finish(el.videoWidth >= el.videoHeight ? 'landscape' : 'portrait');
                    el.onerror = () => finish('landscape');
                    el.querySelector('source').src = item.src;
                    el.load();
                }
            });
        }

        function createCaptionElement(item) {
            const cap = document.createElement('div');
            cap.className = 'slide-caption';
            cap.textContent = item.title || '';
            return cap;
        }

        function shuffle(arr) {
            const a = arr.slice();
            for (let i = a.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [a[i], a[j]] = [a[j], a[i]];
            }
            return a;
        }

        // Raggruppa per "project": dentro ogni progetto abbina i verticali
        // consecutivi a due a due. Immagini di progetti diversi non vengono MAI
        // messe nella stessa coppia.
        function buildBlocksFromProjects(items) {
            const byProject = new Map();
            items.forEach(item => {
                const key = item.project ? item.project : `single-${item.src}`;
                if (!byProject.has(key)) byProject.set(key, []);
                byProject.get(key).push(item);
            });

            const blocks = [];
            byProject.forEach(group => {
                let i = 0;
                while (i < group.length) {
                    const curr = group[i];
                    const next = group[i + 1];
                    if (curr.orientation === 'portrait' && next && next.orientation === 'portrait') {
                        blocks.push([curr, next]);
                        i += 2;
                    } else {
                        blocks.push([curr]);
                        i += 1;
                    }
                }
            });
            return blocks;
        }

        function buildGroups() {
            if (!shuffledBlocks) {
                shuffledBlocks = shuffle(buildBlocksFromProjects(preparedItems));
            }
            if (isDesktopState) {
                return shuffledBlocks;
            }
            // Mobile: un'immagine per slide, ma mantenendo lo stesso ordine mescolato.
            return shuffledBlocks.flatMap(block => block.map(item => [item]));
        }

        function renderSlides(groups) {
            const container = document.getElementById('slideshow');
            container.innerHTML = '';
            groups.forEach(group => {
                const slide = document.createElement('div');
                slide.className = 'slide';

                if (group.length === 2) {
                    const pair = document.createElement('div');
                    pair.className = 'slide-pair';
                    group.forEach(item => {
                        const half = document.createElement('div');
                        half.className = 'pair-half';
                        half.appendChild(item.el);
                        half.appendChild(createCaptionElement(item));
                        pair.appendChild(half);
                    });
                    slide.appendChild(pair);
                } else {
                    slide.appendChild(group[0].el);
                    slide.appendChild(createCaptionElement(group[0]));
                }

                container.appendChild(slide);
            });
        }

        const HOLD_MS = 4000;
        const FADE_MS = 1000;
        const GAP_MS = 800;

        let current = 0;
        let slides = [];
        let slideshowRunning = false;

        function getMediaEls(slide) {
            return Array.from(slide.querySelectorAll('.slide-media'));
        }
        function playVideos(slide) {
            getMediaEls(slide).forEach(media => {
                if (media.tagName === 'VIDEO') {
                    media.currentTime = 0;
                    media.play().catch(() => {});
                }
            });
        }
        function pauseVideos(slide) {
            getMediaEls(slide).forEach(media => {
                if (media.tagName === 'VIDEO') media.pause();
            });
        }

        function runSlideshow() {
            if (slides.length === 0 || !slideshowRunning) return;
            const slide = slides[current];
            slide.classList.add('active');
            playVideos(slide);

            slideshowTimeoutId = setTimeout(() => {
                slide.classList.remove('active');
                pauseVideos(slide);

                fadeTimeoutId = setTimeout(() => {
                    current = (current + 1) % slides.length;
                    runSlideshow();
                }, FADE_MS + GAP_MS);
            }, HOLD_MS);
        }

        function stopSlideshow() {
            slideshowRunning = false;
            clearTimeout(slideshowTimeoutId);
            clearTimeout(fadeTimeoutId);

            slides.forEach(slide => {
                slide.classList.remove('active');
                pauseVideos(slide);
            });
        }

        // --- AVVIO E RIDIMENSIONAMENTO ---
        async function startSlideshow() {
            // Carica (una sola volta) tutti i file e rileva il loro orientamento.
            if (preparedItems.length === 0) {
                preparedItems = await Promise.all(MEDIA_LIST.map((item, idx) => loadItem(item, idx)));
            }

            const groups = buildGroups();
            renderSlides(groups);
            slides = Array.from(document.querySelectorAll('.slideshow-container .slide'));

            current = 0;
            slideshowRunning = true;
            runSlideshow();
        }

        startSlideshow();

        window.addEventListener('resize', () => {
            const width = window.innerWidth;
            const nowIsDesktop = width >= DESKTOP_BREAKPOINT;

            if (isDesktopState !== nowIsDesktop) {
                isDesktopState = nowIsDesktop;
                updateBodyClass();

                stopSlideshow();
                startSlideshow(); // rigenera i gruppi (gli elementi sono già in cache, non si ricaricano)
            }
        });

        // --- CLICCARE IN QUALSIASI PUNTO PORTA ALLA PAGINA ABOUT ---
        document.addEventListener('click', function(event) {
            if (event.target.closest('a')) return;
            window.location.href = 'about.html';
        });

    </script>

  </body>
</html>
