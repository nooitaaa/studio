<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Noa Merlini</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Times New Roman", Times, serif;
    font-size: 13px;
    line-height: 15px;
    background: white;
    color: black;
  }
  .footer1 {
    position: fixed;
    top: 0; left: 0; right: 0;
    display: flex;
    justify-content: flex-end;
    align-items: flex-start;
    padding: 8px 10px 10px 10px;
    background: white;
    z-index: 1000;
  }
  .header-right { text-align: right; }

  .slideshow-container {
    position: relative;
    overflow: hidden;
    background-color: white;
    width: 100vw;
    height: 100vh;
    padding-top: 0px;
  }

  .slide {
    position: absolute;
    top: 0px; left: 0; right: 0; bottom: 0;
    display: flex;
    align-items: flex-start;
    justify-content: flex-start;
    opacity: 0;
    pointer-events: none;
    transition: opacity 2s ease;
  }
  .slide.active { opacity: 1; }

  /* orizzontale: largo, poco alto -> vuoto sopra/sotto */
  .ph.landscape { width: 100%; height: 45%; background:#666; }
  /* verticale: stretto, alto -> vuoto ai lati */
  .ph.portrait { width: 35%; height: 100%; background:#333; }
  .ph.square { width: 60%; height: 100%; background:#8a8a8a; }

  .slideshow-caption {
    position: fixed;
    top: 50%;
    left: 10px;
    transform: translateY(-50%);
    color: white;
    mix-blend-mode: difference;
    z-index: 10;
    text-align: left;
    font-family: "Times New Roman", Times, serif;
    font-size: 30px;
    line-height: 1.00;
    pointer-events: none;
  }

  .note {
    position: fixed;
    bottom: 10px;
    left: 10px;
    font-family: sans-serif;
    font-size: 11px;
    color: #999;
    z-index: 10;
  }
</style>
</head>
<body>

  <div class="footer1">
    <div class="header-right">Milan, Italy</div>
  </div>

  <div class="slideshow-container">
    <div class="slide"><div class="ph portrait"><img src="images/0_random.jpg" alt="0_random"></div>
    <div class="slide"><div class="ph portrait"><img src="images/2_camouflage.jpg" alt="2_camouflage"></div>
    <div class="slide"><div class="ph portrait"><img src="images/3_tesi_ma.jpg" alt="3_tesi_ma"></div>
    <div class="slide"><div class="ph portrait">verticale</div></div>

    <div class="slideshow-caption">Noa Merlini<br>Concept research and Creative development</div>
  </div>

  <div class="note">Anteprima con placeholder — le tue immagini reali andranno al posto dei rettangoli grigi</div>

<script>
  const HOLD_MS = 3000;
  const FADE_MS = 800;
  const GAP_MS = 1000;

  const slides = Array.from(document.querySelectorAll('.slide'));
  let current = 0;

  function run() {
    const slide = slides[current];
    slide.classList.add('active');

    setTimeout(() => {
      slide.classList.remove('active');
      setTimeout(() => {
        current = (current + 3) % slides.length;
        run();
      }, FADE_MS + GAP_MS);
    }, HOLD_MS);
  }

  run();
</script>

</body>
</html>
