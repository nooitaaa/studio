        <div id="page-content">

    <a href="about.html" class="slideshow-caption">
        Noa Merlini<br>

        <script>
            (() => {
        // La lista ora rispecchia ESATTAMENTE i nomi dei tuoi file reali
        const MEDIA_LIST = [
            { title: 'Camouflage', caption: 'Camouflage. An Act of conformity and resistance, 2024-5. Research, writing, graphic and book design.', project: 'camouflage', files: ['Camouflage_1.jpeg', 'Camouflage_2.jpeg', 'Camouflage_3.jpeg', 'Camouflage_4.jpeg', 'Camouflage_6.jpeg', 'Camouflage_8.jpeg', 'Camouflage_9.jpeg', 'Camouflage_10.jpeg'] },
            { title: 'DDDD', caption: 'Editorial and Production Assistant for Daily Dense Dance Desiderio (DDDD) by Riccardo Benassi, 2021', project: 'dddd', files: ['DDDD_1.jpeg'] },
            { title: 'DDDD Book', caption: 'Editorial Coordinator and Contributing Author for Daily Dense Dance Desiderio (DDDD) by Riccardo Benassi, 2024', project: 'dddd book', files: ['DDDDBook_1.jpeg', 'DDDDBook_2.jpeg'] },
            { title: 'Danceflorensick', caption: 'Camera and Production Assistant for Danceflorensick by Riccardo Benassi, 2022', project: 'danceflorensick', files: ['Danceflosensick_1.jpeg'] },
            { title: 'Deviante', caption: 'Magazine cover design for Deviante, 2024', project: 'deviante', files: ['Deviante.jpg'] },
            { title: 'First Sight', caption: 'Photography and book design for First Sight, 2025', project: 'first sight', files: ['FirstSight_1.jpeg'] },
            { title: 'Flash Art', caption: 'Graphic design for Casa Flash Art by Chiara Belardi, 2023', project: 'flash art', files: ['FlashArt_1.jpeg', 'FlashArt_2.jpeg'] },
            { title: 'Frey Barth', caption: 'Freelance Junior Graphic Designer for Carina Frey and Stefanie Barth, 2025-6', project: 'frey barth', files: ['FreyBarth_1.jpeg', 'FreyBarth_2.jpeg'] },
            { title: 'Hyper Inertia', caption: 'Editorial Art Direction and Graphic Design with Francesca Barizza for Deviante, 2024', project: 'hyper inertia', files: ['HyperInertia_1.jpeg', 'HyperInertia_2.jpeg', 'HyperInertia_3.jpeg'] },
            { title: 'KV ROES', caption: 'Head of Communication and Graphic Design for Kv Roes, 2024 ongoing', project: 'kv roes', files: ['KvRoes_3.jpeg', 'KvRoes_4.jpeg', 'KvRoes_5.jpeg', 'KvRoes_7.jpeg', 'KvRoes_8.jpeg', 'KvRoes_9.jpeg'] },
            { title: 'Maquette', caption: 'Visual Identity and Art Direction for Maquette with Pepe Spike Studio, 2026', project: 'maquette', files: ['Maquette_.jpeg', 'Maquette_1.jpeg', 'Maquette_10.jpeg', 'Maquette_11.jpeg', 'Maquette_2.jpeg', 'Maquette_3.jpeg', 'Maquette_4.jpeg', 'Maquette_5.jpeg', 'Maquette_6.jpeg', 'Maquette_8.jpeg', 'Maquette_9.jpeg'] },
            { title: 'Process', caption: 'Pics from Design process', project: 'process', files: ['Process_2.jpeg', 'Process_3.jpeg'] },
            { title: 'Radio Spugna', caption: 'Creative Development of radio spugna, 2024–2026', project: 'radio spugna', files: ['RadioSpugna_2.jpeg', 'RadioSpugna_3.jpeg', 'RadioSpugna_4.jpeg', 'RadioSpugna_6.jpeg'] },
            { title: 'Radio Spugna Book', caption: 'Book Design and Art director of radio spugna, il libro-manuale, 2025', project: 'radio spugna book', files: ['RadioSpugnaBook_1.jpeg', 'RadioSpugnaBook_2.jpeg', 'RadioSpugnaBook_5.jpeg'] },
            { title: 'Senza titolo (autoritratto per travasi)', caption: 'Senza titolo (autoritratto per travasi), performance, 2018', files: ['SenzaTitolo(autoritrattopertravasi).jpeg'] },
            { title: 'Soft Crash', caption: 'Art direction and book design of Soft Crash, 2022', project: 'soft crash', files: ['SoftCrash_1.jpeg', 'SoftCrash_2.jpeg'] },
            { title: 'A.G. Fronzoni', caption: 'Graphic design for AG Fronzoni. Il progetto tra il bianco e il nero with Pepe Spike Studio, 2024', project: 'ag fronzoni', files: ['agfronzoni_1.jpeg', 'agfronzoni_4.jpeg', 'agfronzoni_5.jpeg', 'agfronzoni_6.jpeg'] },
            { title: 'Y', caption: 'Art direction and book design of Y, 2025', project: 'y', files: ['y_1.jpeg', 'y_2.jpeg'] },
        ].flatMap(({ title, caption, project, files }) => files.map(file => ({
            type: 'image',
            src: `images/${file}`,
            title,
            caption,
            project,
        })));

        const DESKTOP_BREAKPOINT = 841;

        let slideshowTimeoutId = null;
        let fadeTimeoutId = null;
        let isDesktopState = window.innerWidth >= DESKTOP_BREAKPOINT;

        let preparedItems = [];
        let slideshowGeneration = 0;
        let shuffledBlocks = null;

        function updateBodyClass() {
            if (isDesktopState) {
                document.body.classList.add('desktop-mode');
                document.body.classList.remove('mobile-mode');
            } else {
                document.body.classList.add('mobile-mode');
                document.body.classList.remove('desktop-mode');
            }
        }
        updateBodyClass();

        function buildMediaElement(item) {
            let el;
            if (item.type === 'image') {
                el = document.createElement('img');
                el.alt = item.title || 'Portfolio image';
                el.loading = 'lazy';
                el.decoding = 'async';
                el.dataset.src = item.src;
                el.src = '';
            } else {
                el = document.createElement('video');
                el.loop = true;
                el.muted = true;
                el.playsInline = true;
                el.classList.add('video-toggle');
                const source = document.createElement('source');
                source.type = 'video/mp4';
                el.appendChild(source);
            }
            el.classList.add('slide-media');
            return el;
        }

        function loadItem(item) {
            const el = buildMediaElement(item);
            if (item.type !== 'image') {
                return Promise.resolve({ ...item, el, orientation: 'unknown' });
            }

            el.loading = 'eager';
            el.src = item.src;

            return new Promise(resolve => {
                const finishLoading = () => {
                    const orientation = !el.naturalWidth || !el.naturalHeight
                        ? 'unknown'
                        : el.naturalHeight > el.naturalWidth ? 'portrait' : 'landscape';
                    resolve({ ...item, el, orientation });
                };

                if (el.complete) {
                    finishLoading();
                } else {
                    el.addEventListener('load', finishLoading, { once: true });
                    el.addEventListener('error', finishLoading, { once: true });
                }
            });
        }

        function createCaptionElement(item) {
            const cap = document.createElement('div');
            cap.className = 'slide-caption';
            cap.textContent = item.caption || item.title || '';
            return cap;
        }

        const captionMeasureContext = document.createElement('canvas').getContext('2d');

        function formatSharedCaption(caption) {
            const words = caption.textContent.trim().split(/\s+/);
            if (!captionMeasureContext || !words.length) return;

            captionMeasureContext.font = getComputedStyle(caption).font;
            const availableWidth = caption.clientWidth;
            let firstLineWordCount = 0;

            for (const word of words) {
                const candidate = [...words.slice(0, firstLineWordCount), word].join(' ');
                if (firstLineWordCount && captionMeasureContext.measureText(candidate).width > availableWidth) break;
                firstLineWordCount++;
            }

            const firstLine = document.createElement('span');
            firstLine.className = 'shared-caption-first-line';
            firstLine.textContent = words.slice(0, firstLineWordCount).join(' ');
            caption.replaceChildren(firstLine);

            const continuation = words.slice(firstLineWordCount).join(' ');
            if (continuation) {
                const rest = document.createElement('span');
                rest.className = 'shared-caption-continuation';
                rest.textContent = continuation;
                caption.appendChild(rest);
            }
        }

        const contrastCanvas = document.createElement('canvas');
        const contrastContext = contrastCanvas.getContext('2d', { willReadFrequently: true });

        function relativeLuminance(red, green, blue) {
            const linearize = value => {
                const channel = value / 255;
                return channel <= 0.04045 ? channel / 12.92 : ((channel + 0.055) / 1.055) ** 2.4;
            };
            return 0.2126 * linearize(red) + 0.7152 * linearize(green) + 0.0722 * linearize(blue);
        }

        function getCaptionContrastMode(caption, images) {
            const textLines = [];
            const walker = document.createTreeWalker(caption, NodeFilter.SHOW_TEXT);
            while (walker.nextNode()) {
                if (!walker.currentNode.textContent.trim()) continue;
                const range = document.createRange();
                range.selectNodeContents(walker.currentNode);
                for (const rect of range.getClientRects()) {
                    if (rect.width && rect.height) {
                        textLines.push({ rect, lowContrastSamples: 0, veryDarkSamples: 0, samples: 0 });
                    }
                }
            }
            if (!contrastContext || !textLines.length || !images.length) return null;

            try {
                for (const image of images) {
                    if (!image.complete || !image.naturalWidth || !image.naturalHeight) continue;

                    const imageRect = image.getBoundingClientRect();
                    const width = Math.max(1, Math.round(imageRect.width));
                    const height = Math.max(1, Math.round(imageRect.height));
                    const overlaps = textLines.map(line => ({
                        line,
                        left: Math.max(line.rect.left, imageRect.left),
                        top: Math.max(line.rect.top, imageRect.top),
                        right: Math.min(line.rect.right, imageRect.right),
                        bottom: Math.min(line.rect.bottom, imageRect.bottom),
                    })).filter(rect => rect.right > rect.left && rect.bottom > rect.top);
                    if (!overlaps.length) continue;

                    contrastCanvas.width = width;
                    contrastCanvas.height = height;
                    contrastContext.fillStyle = 'white';
                    contrastContext.fillRect(0, 0, width, height);

                    const style = getComputedStyle(image);
                    const scale = style.objectFit === 'cover'
                        ? Math.max(width / image.naturalWidth, height / image.naturalHeight)
                        : Math.min(width / image.naturalWidth, height / image.naturalHeight);
                    const drawnWidth = image.naturalWidth * scale;
                    const drawnHeight = image.naturalHeight * scale;
                    const [horizontal = '50%', vertical = '50%'] = style.objectPosition.split(' ');
                    const positionFraction = (value, start, end) => {
                        if (value === start) return 0;
                        if (value === end) return 1;
                        if (value === 'center') return 0.5;
                        const percentage = Number.parseFloat(value);
                        return Number.isFinite(percentage) ? percentage / 100 : 0.5;
                    };
                    const offsetX = (width - drawnWidth) * positionFraction(horizontal, 'left', 'right');
                    const offsetY = (height - drawnHeight) * positionFraction(vertical, 'top', 'bottom');
                    contrastContext.drawImage(image, offsetX, offsetY, drawnWidth, drawnHeight);

                    const pixels = contrastContext.getImageData(0, 0, width, height).data;
                    for (const rect of overlaps) {
                        const left = Math.max(0, Math.floor(rect.left - imageRect.left));
                        const top = Math.max(0, Math.floor(rect.top - imageRect.top));
                        const right = Math.min(width, Math.ceil(rect.right - imageRect.left));
                        const bottom = Math.min(height, Math.ceil(rect.bottom - imageRect.top));
                        const columns = Math.min(11, Math.max(1, Math.ceil((right - left) / 18)));
                        const rows = Math.min(3, Math.max(1, Math.ceil((bottom - top) / 8)));

                        for (let row = 0; row < rows; row++) {
                            for (let column = 0; column < columns; column++) {
                                const x = Math.min(width - 1, Math.floor(left + (column + 0.5) * (right - left) / columns));
                                const y = Math.min(height - 1, Math.floor(top + (row + 0.5) * (bottom - top) / rows));
                                const offset = (y * width + x) * 4;
                                const background = relativeLuminance(pixels[offset], pixels[offset + 1], pixels[offset + 2]);
                                const blackContrast = (background + 0.05) / 0.05;

                                if (blackContrast < 4.5) rect.line.lowContrastSamples++;
                                if (blackContrast < 2) rect.line.veryDarkSamples++;
                                rect.line.samples++;
                            }
                        }
                    }
                }

                if (textLines.some(line => line.samples > 0 && line.veryDarkSamples >= line.samples * 0.8)) {
                    return 'extreme';
                }
                if (textLines.some(line => line.samples > 0 && line.lowContrastSamples >= line.samples * 0.8)) {
                    return 'difference';
                }
                return null;
            } catch {
                return null;
            }
        }

        function updateSlideCaptionContrast(slide) {
            const images = [...(slide?.querySelectorAll('img.slide-media') || [])];
            slide?.querySelectorAll('.slide-caption').forEach(caption => {
                const mode = getCaptionContrastMode(caption, images);
                caption.classList.toggle('needs-contrast', mode === 'difference');
                caption.classList.toggle('extreme-contrast', mode === 'extreme');
            });
            document.querySelector('.slideshow-caption')?.classList.remove('needs-contrast', 'extreme-contrast');
        }

        function shuffle(arr) {
            const a = arr.slice();
            for (let i = a.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [a[i], a[j]] = [a[j], a[i]];
            }
            return a;
        }

        function buildBlocksFromProjects(items) {
            const byProject = new Map();
            items.forEach(item => {
                const key = item.project ? item.project : `single-${item.src}`;
                if (!byProject.has(key)) byProject.set(key, []);
                byProject.get(key).push(item);
            });

            const blocks = [];
            byProject.forEach(group => {
                const verticals = group.filter(item => item.orientation === 'portrait');
                const others = group.filter(item => item.orientation !== 'portrait');

                for (let i = 0; i < verticals.length; i += 2) {
                    blocks.push(verticals.slice(i, i + 2));
                }
                others.forEach(item => blocks.push([item]));
            });
            return blocks;
        }

        function buildGroups() {
            if (!shuffledBlocks) {
                shuffledBlocks = shuffle(buildBlocksFromProjects(preparedItems));
            }
            if (isDesktopState) {
                return shuffledBlocks;
            }
            return shuffledBlocks.flatMap(block => block.map(item => [item]));
        }

        function renderSlides(groups) {
            const container = document.getElementById('slideshow');
            container.innerHTML = '';

            const whiteFade = document.createElement('div');
            whiteFade.className = 'white-fade';
            container.appendChild(whiteFade);

            groups.forEach(group => {
                const slide = document.createElement('div');
                slide.className = 'slide';

                if (group.length === 2) {
                    const pair = document.createElement('div');
                    pair.className = 'slide-pair';
                    const sameCaption = group[0].caption && group[0].caption === group[1].caption;

                    group.forEach((item, index) => {
                        const half = document.createElement('div');
                        half.className = 'pair-half';
                        half.appendChild(item.el);

                        if (!(sameCaption && index === 1)) {
                            const caption = createCaptionElement(item);
                            if (sameCaption) {
                                half.classList.add('pair-half-shared-caption');
                                caption.classList.add('slide-caption-shared');
                            }
                            half.appendChild(caption);
                        }

                        pair.appendChild(half);
                    });
                    slide.appendChild(pair);
                } else {
                    slide.appendChild(group[0].el);
                    slide.appendChild(createCaptionElement(group[0]));
                }

                container.appendChild(slide);
                slide.querySelectorAll('.slide-caption-shared').forEach(formatSharedCaption);
            });
        }

        const HOLD_MS = 4000;
        const FADE_MS = 1200;
        const GAP_MS = 0;

        let current = 0;
        let slides = [];
        let slideshowRunning = false;
        const TRANSITION_MS = 1200;
        let transitionTimerId = null;
        let whiteFadeTimerId = null;

        function getMediaEls(slide) {
            return Array.from(slide.querySelectorAll('.slide-media'));
        }
        function ensureSlideMediaLoaded(slide) {
            if (!slide) return Promise.resolve();
            const images = getMediaEls(slide).filter(media => media.tagName === 'IMG');
            images.forEach(image => {
                image.loading = 'eager';
                if (image.dataset.src && !image.getAttribute('src')) {
                    image.src = image.dataset.src;
                }
            });
            return Promise.all(images.map(image => {
                if (image.complete) return Promise.resolve();
                return new Promise(resolve => {
                    image.addEventListener('load', resolve, { once: true });
                    image.addEventListener('error', resolve, { once: true });
                });
            }));
        }
        function playVideos(slide) {
            getMediaEls(slide).forEach(media => {
                if (media.tagName === 'VIDEO') {
                    media.currentTime = 0;
                    media.play().catch(() => {});
                }
            });
        }
        function pauseVideos(slide) {
            getMediaEls(slide).forEach(media => {
                if (media.tagName === 'VIDEO') media.pause();
            });
        }

        function triggerWhiteFade() {
            const whiteFade = document.querySelector('.white-fade');
            if (!whiteFade) return;
            clearTimeout(whiteFadeTimerId);
            whiteFade.classList.remove('active');
            void whiteFade.offsetWidth;
            whiteFade.classList.add('active');
            whiteFadeTimerId = setTimeout(() => whiteFade.classList.remove('active'), 220);
        }

        function goToSlide(delta) {
            if (!slides.length || !slideshowRunning || transitionTimerId) return;

            clearTimeout(slideshowTimeoutId);
            clearTimeout(fadeTimeoutId);

            const currentSlide = slides[current];
            const nextIndex = (current + delta + slides.length) % slides.length;
            const nextSlide = slides[nextIndex];
            if (!currentSlide || !nextSlide) return;

            if (!isDesktopState) {
                const imageReady = ensureSlideMediaLoaded(nextSlide);
                currentSlide.classList.remove('active');
                pauseVideos(currentSlide);
                transitionTimerId = setTimeout(() => {
                    imageReady.then(() => {
                        if (!slideshowRunning || slides[current] !== currentSlide) {
                            transitionTimerId = null;
                            return;
                        }

                        current = nextIndex;
                        triggerWhiteFade();
                        nextSlide.classList.add('active');
                        updateSlideCaptionContrast(nextSlide);
                        playVideos(nextSlide);
                        ensureSlideMediaLoaded(slides[(current + 1) % slides.length]);
                        transitionTimerId = setTimeout(() => {
                            transitionTimerId = null;
                            if (slideshowRunning) {
                                slideshowTimeoutId = setTimeout(() => goToSlide(1), HOLD_MS);
                            }
                        }, 220);
                    });
                }, TRANSITION_MS);
                return;
            }

            currentSlide.classList.remove('active');
            pauseVideos(currentSlide);

            transitionTimerId = setTimeout(() => {
                current = nextIndex;
                triggerWhiteFade();
                ensureSlideMediaLoaded(nextSlide);
                nextSlide.classList.add('active');
                updateSlideCaptionContrast(nextSlide);
                playVideos(nextSlide);
                transitionTimerId = setTimeout(() => {
                    transitionTimerId = null;
                    if (slideshowRunning) {
                        slideshowTimeoutId = setTimeout(() => goToSlide(1), HOLD_MS);
                    }
                }, 220);
            }, TRANSITION_MS);
        }

        function runSlideshow() {
            if (slides.length === 0 || !slideshowRunning) return;
            const slide = slides[current];
            const showSlide = () => {
                slide.classList.add('active');
                updateSlideCaptionContrast(slide);
                playVideos(slide);
                if (!isDesktopState && slides.length > 1) {
                    ensureSlideMediaLoaded(slides[(current + 1) % slides.length]);
                }
                slideshowTimeoutId = setTimeout(() => goToSlide(1), HOLD_MS);
            };

            if (!isDesktopState) {
                ensureSlideMediaLoaded(slide).then(() => {
                    if (slideshowRunning && slides[current] === slide) showSlide();
                });
            } else {
                ensureSlideMediaLoaded(slide);
                showSlide();
            }
        }

        function stopSlideshow() {
            slideshowGeneration++;
            slideshowRunning = false;
            clearTimeout(slideshowTimeoutId);
            clearTimeout(fadeTimeoutId);
            clearTimeout(transitionTimerId);
            clearTimeout(whiteFadeTimerId);
            transitionTimerId = null;

            slides.forEach(slide => {
                slide.classList.remove('active');
                pauseVideos(slide);
            });
        }

        async function startSlideshow() {
            const generation = ++slideshowGeneration;
            if (preparedItems.length === 0 || (isDesktopState && preparedItems.some(item => item.orientation === 'unknown'))) {
                const items = isDesktopState
                    ? await Promise.all(MEDIA_LIST.map(item => loadItem(item)))
                    : MEDIA_LIST.map(item => ({ ...item, el: buildMediaElement(item), orientation: 'unknown' }));

                if (generation !== slideshowGeneration) return;
                preparedItems = items;
                shuffledBlocks = null;
            }

            if (generation !== slideshowGeneration) return;

            const groups = buildGroups();
            renderSlides(groups);
            slides = Array.from(document.querySelectorAll('.slideshow-container .slide'));

            current = 0;
            slideshowRunning = true;
            slideshowTimeoutId = setTimeout(runSlideshow, 500);
        }

        startSlideshow();

        const handleResize = () => {
            const width = window.innerWidth;
            const nowIsDesktop = width >= DESKTOP_BREAKPOINT;

            if (isDesktopState !== nowIsDesktop) {
                isDesktopState = nowIsDesktop;
                updateBodyClass();

                stopSlideshow();
                startSlideshow();
            } else {
                document.querySelectorAll('.slide-caption-shared').forEach(formatSharedCaption);
                updateSlideCaptionContrast(slides[current]);
            }
        };
        window.addEventListener('resize', handleResize);

        const slideshowContainer = document.getElementById('slideshow');
        let lastTapTime = 0;

        function handleSlideNavigation(event) {
            if (event.target.closest('a')) return;

            const now = Date.now();
            if (now - lastTapTime < 350) return;
            lastTapTime = now;

            const point = event.touches?.[0] || event.changedTouches?.[0] || event;
            const rect = slideshowContainer.getBoundingClientRect();
            const x = point.clientX - rect.left;
            if (x < rect.width / 2) {
                goToSlide(-1);
            } else {
                goToSlide(1);
            }

            if (event.type === 'touchstart') event.preventDefault();
        }

        slideshowContainer.addEventListener('touchstart', handleSlideNavigation, { passive: false });
        const handlePointerNavigation = event => {
            if (event.pointerType !== 'touch') handleSlideNavigation(event);
        };
        slideshowContainer.addEventListener('pointerdown', handlePointerNavigation);

        window.sitePageCleanup = () => {
            stopSlideshow();
            window.removeEventListener('resize', handleResize);
            slideshowContainer.removeEventListener('touchstart', handleSlideNavigation);
            slideshowContainer.removeEventListener('pointerdown', handlePointerNavigation);
            window.sitePageCleanup = null;
        };
      })();
    </script>
